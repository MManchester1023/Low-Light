<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Low Light</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
  </script>
</head>
<body>
  <canvas id="view"></canvas>

  <div id="hud">
        <div id="crosshair"></div>
    <div id="hurt"></div>
    <div id="alert"></div>
    <div id="guardTag"><div class="icon"></div><div class="bar"><div class="fill"></div></div></div>
    <div id="bottom"><div id="prompt"></div></div>

    <!-- Wrist unit: the player's field computer, strapped to the left forearm. Replaces the old bars. -->
    <div id="wrist">
      <div class="strap"></div>
      <div class="bezel">
        <div class="brand"><span>KESTREL</span><span class="model">FC-3</span><span class="led" id="wristLed"></span></div>
        <div class="screen">
          <div class="obj" id="objective">OBJ ▸ take the files from the desk in the east room</div>
          <div class="row">
            <span class="k">VIS</span>
            <div class="cells" id="visCells"></div>
            <span class="v" id="visWord">DARK</span>
          </div>
          <div class="row">
            <span class="k">SND</span>
            <canvas id="scope" width="176" height="24"></canvas>
            <span class="v" id="sndWord">0.0m</span>
          </div>
          <div class="row">
            <span class="k">VIT</span>
            <div class="cells hp" id="hpCells"></div>
            <span class="v" id="health">100</span>
          </div>
          <div class="sep"></div>
          <div class="row foot">
            <div class="kit">
              <div><span class="k">PST</span> <span class="pips" id="ammoPips"></span> <span id="ammoText"></span></div>
              <div id="held"></div>
            </div>
            <div class="side">
              <div id="status" class="status">QUIET</div>
              <div class="stance" id="stance"></div>
              <div id="nv">NV ON</div>
            </div>
          </div>
          <div class="glare"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="menu" class="hidden">
    <div class="panel main">
      <h1>Paused</h1>
      <button data-act="resume">Resume</button>
      <button data-act="restart">Restart</button>
      <button data-act="settings">Settings</button>
    </div>
    <div class="panel settings hidden">
      <h1>Settings</h1>
      <h2>Controls</h2>
      <p class="hint">Click a key, then press the new one (Esc cancels).</p>
      <ul class="binds"></ul>
      <div class="row">
        <button data-act="defaults">Reset to defaults</button>
        <button data-act="back">Back</button>
      </div>
    </div>
  </div>

  <div id="overlay">
    <div class="box">
      <h1>Low Light</h1>
      <p class="msg">Click to play</p>
      <p class="small"></p>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
  <script>
    // If the game code never loads (opened as a file, or the Three.js download failed), say so.
    setTimeout(function () {
      if (window.game) return;
      var msg = document.querySelector('#overlay .msg');
      var small = document.querySelector('#overlay .small');
      if (location.protocol === 'file:') {
        msg.textContent = "The game can't load when index.html is opened as a file.";
        small.textContent = 'Run "node serve.js" in this folder, then open http://localhost:8080';
      } else {
        msg.textContent = "The game didn't load.";
        small.textContent = 'Check your internet connection (Three.js loads from cdn.jsdelivr.net), then reload.';
      }
    }, 4000);
  </script>
</body>
</html>
