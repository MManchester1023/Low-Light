<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Low Light</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
  </script>
</head>
<body>
  <canvas id="view"></canvas>

  <div id="hud">
        <div id="crosshair"></div>
    <div id="objective">Objective: take the files from the desk in the east room</div>
    <div id="guardTag"><div class="icon"></div><div class="bar"><div class="fill"></div></div></div>
    <div id="bottom">
      <div id="prompt"></div>
      <div id="meter">
        <div class="label">LIGHT</div>
        <div class="track"><div class="fill"></div></div>
        <div class="noise-row">
          <div class="label">NOISE</div>
          <div class="noise-track"><div class="noise-fill"></div></div>
        </div>
        <div class="stance"></div>
        <div id="nv">NV</div>
        <div id="held"></div>
      </div>
    </div>
  </div>

  <div id="menu" class="hidden">
    <div class="panel main">
      <h1>Paused</h1>
      <button data-act="resume">Resume</button>
      <button data-act="restart">Restart</button>
      <button data-act="settings">Settings</button>
    </div>
    <div class="panel settings hidden">
      <h1>Settings</h1>
      <h2>Controls</h2>
      <p class="hint">Click a key, then press the new one (Esc cancels).</p>
      <ul class="binds"></ul>
      <div class="row">
        <button data-act="defaults">Reset to defaults</button>
        <button data-act="back">Back</button>
      </div>
    </div>
  </div>

  <div id="overlay">
    <div class="box">
      <h1>Low Light</h1>
      <p class="msg">Click to play</p>
      <p class="small"></p>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
  <script>
    // If the game code never loads (opened as a file, or the Three.js download failed), say so.
    setTimeout(function () {
      if (window.game) return;
      var msg = document.querySelector('#overlay .msg');
      var small = document.querySelector('#overlay .small');
      if (location.protocol === 'file:') {
        msg.textContent = "The game can't load when index.html is opened as a file.";
        small.textContent = 'Run "node serve.js" in this folder, then open http://localhost:8080';
      } else {
        msg.textContent = "The game didn't load.";
        small.textContent = 'Check your internet connection (Three.js loads from cdn.jsdelivr.net), then reload.';
      }
    }, 4000);
  </script>
</body>
</html>
